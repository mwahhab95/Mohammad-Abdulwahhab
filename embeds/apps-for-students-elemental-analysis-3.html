<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHD Calculator</title>
    <!-- Importing the Roboto font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">

    <style>
        /* Basic styling for the page body */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* The main container for the calculator */
        .calculator-container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px; /* Adjusted width for a 2x2 layout */
        }

        h1 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Grid layout for the inputs, now fixed to 2 columns */
        .input-grid {
            display: grid;
            /* This line creates the 2x2 grid */
            grid-template-columns: repeat(2, 1fr); 
            gap: 25px; /* Added a bit more gap for spacing */
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Styling for the labels (C, H, N, X) */
        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        /* Styling for the number input fields */
        input[type="number"] {
            width: 80px; /* Slightly wider for a better look */
            padding: 8px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #007bff;
        }
        
        /* Hiding the default arrows on number inputs for a cleaner look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
          -webkit-appearance: none; 
          margin: 0; 
        }
        input[type=number] {
          -moz-appearance: textfield;
        }

        /* Styling for the calculate button */
        button {
            width: 100%;
            padding: 12px;
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Styling for the result display area */
        .result-display {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px; /* Prevents layout shift when text appears */
        }
        
        .result-display.success {
            color: #0056b3;
        }
        
        .result-display.error {
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h1>IHD Calculator</h1>

        <div class="input-grid">
            <div class="input-group">
                <label for="carbons">Carbons (C):</label>
                <input type="number" id="carbons" min="0" placeholder="0">
            </div>
            <div class="input-group">
                <label for="hydrogens">Hydrogens (H):</label>
                <input type="number" id="hydrogens" min="0" placeholder="0">
            </div>
            <div class="input-group">
                <label for="nitrogens">Nitrogens (N):</label>
                <input type="number" id="nitrogens" min="0" placeholder="0">
            </div>
            <div class="input-group">
                <label for="halogens">Halogens (X):</label>
                <input type="number" id="halogens" min="0" placeholder="0">
            </div>
        </div>

        <button id="calculate-btn">Calculate IHD</button>

        <p id="result-label" class="result-display"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const entryC = document.getElementById('carbons');
            const entryH = document.getElementById('hydrogens');
            const entryN = document.getElementById('nitrogens');
            const entryX = document.getElementById('halogens');
            const calculateBtn = document.getElementById('calculate-btn');
            const resultLabel = document.getElementById('result-label');

            function calculateIHD() {
                const C = parseInt(entryC.value) || 0;
                const H = parseInt(entryH.value) || 0;
                const N = parseInt(entryN.value) || 0;
                const X = parseInt(entryX.value) || 0;

                const IHD = (2 * C + 2 - H + N - X) / 2;

                resultLabel.className = 'result-display';

                if (IHD < 0) {
                    resultLabel.textContent = "Error: IHD can't be a negative value!";
                    resultLabel.classList.add('error');
                } else if (IHD % 1 !== 0) {
                    resultLabel.textContent = "Error: IHD should be an integer!";
                    resultLabel.classList.add('error');
                } else {
                    resultLabel.textContent = `IHD: ${IHD}`;
                    resultLabel.classList.add('success');
                }
            }

            calculateBtn.addEventListener('click', calculateIHD);
            
            const allInputs = [entryC, entryH, entryN, entryX];
            allInputs.forEach(input => {
                input.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        calculateIHD();
                    }
                });
            });
        });
    </script>

</body>
</html>
