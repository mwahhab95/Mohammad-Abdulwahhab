<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Chemistry Nomenclature Trainer</title>
<script src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: #f4f7f9;
color: #333;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
padding: 20px;
box-sizing: border-box;
}
#quiz-container {
background-color: #ffffff;
border-radius: 12px;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
width: 100%;
max-width: 420px;
padding: 25px;
text-align: center;
box-sizing: border-box;
}
#title {
background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
font-size: 1.8em;
font-weight: bold;
margin: 0 0 5px 0;
line-height: 1.2;
}
#subtitle {
color: #666;
font-size: 0.9em;
margin: 0 0 20px 0;
font-style: italic;
}
#menu-screen {
display: block;
}
#quiz-screen {
display: none;
}
.class-selector {
width: 100%;
padding: 12px;
margin: 15px 0;
font-size: 16px;
border: 2px solid #667eea;
border-radius: 8px;
background-color: #f8f9fa;
cursor: pointer;
transition: all 0.2s;
}
.class-selector:hover {
background-color: #e9ecef;
border-color: #764ba2;
}
.start-btn {
background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
color: white;
border: none;
border-radius: 8px;
padding: 15px 30px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
width: 100%;
transition: transform 0.2s, box-shadow 0.2s;
margin-top: 10px;
}
.start-btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}
#status-box {
background: rgba(102, 126, 234, 0.08);
border-left: 4px solid #667eea;
padding: 10px 15px;
border-radius: 6px;
margin: 10px 0;
font-size: 0.95em;
line-height: 1.6;
text-align: left;
}
#status-box strong {
color: #667eea;
}
#molecule-canvas {
width: 280px;
height: 260px;
margin: 15px auto;
border: 2px solid #667eea;
border-radius: 8px;
display: block;
background-color: white;
}
#loader {
font-size: 1em;
color: #555;
min-height: 260px;
display: flex;
align-items: center;
justify-content: center;
}
#choices-label {
font-weight: 600;
font-size: 1.05em;
margin: 15px 0 10px 0;
text-align: left;
}
#options-container {
list-style-type: none;
padding: 0;
margin: 10px 0;
text-align: left;
}
.option {
background-color: #f8f9fa;
border: 1px solid rgba(102, 126, 234, 0.2);
border-radius: 8px;
padding: 12px 15px;
margin-bottom: 8px;
cursor: pointer;
transition: all 0.2s;
font-size: 1.1em;
letter-spacing: 0.3px;
}
.option:hover:not(.disabled) {
transform: translateX(4px);
background: rgba(102, 126, 234, 0.1);
border-color: #667eea;
box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
}
.option.correct {
background-color: #d4edda;
border-color: #c3e6cb;
color: #155724;
font-weight: 600;
}
.option.incorrect {
background-color: #f8d7da;
border-color: #f5c6cb;
color: #721c24;
}
.option.disabled {
cursor: not-allowed;
pointer-events: none;
opacity: 0.6;
}
#feedback {
background: rgba(128, 128, 128, 0.08);
padding: 10px 15px;
border-radius: 6px;
margin: 10px 0;
border-left: 3px solid #667eea;
font-size: 0.95em;
min-height: 36px;
text-align: left;
font-weight: 600;
}
.btn-primary {
background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
color: white;
border: none;
border-radius: 8px;
padding: 12px 25px;
font-size: 16px;
cursor: pointer;
transition: all 0.2s;
margin: 5px;
}
.btn-primary:hover {
transform: translateY(-2px);
box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}
.btn-secondary {
background-color: #6c757d;
color: white;
border: none;
border-radius: 8px;
padding: 12px 25px;
font-size: 16px;
cursor: pointer;
transition: all 0.2s;
margin: 5px;
}
.btn-secondary:hover {
background-color: #5a6268;
transform: translateY(-2px);
}
.btn-container {
display: flex;
justify-content: center;
flex-wrap: wrap;
margin-top: 15px;
}
@media (max-width: 768px) {
#title {
font-size: 1.5em;
}
#subtitle {
font-size: 0.85em;
}
#molecule-canvas {
width: 100%;
max-width: 280px;
height: 240px;
}
.option {
padding: 10px 12px;
font-size: 1em;
}
}
</style>
</head>
<body>
<div id="quiz-container">
<h1 id="title">🧪 Organic Chemistry Nomenclature Trainer</h1>
<p id="subtitle">Master IUPAC nomenclature through interactive practice</p>
<!-- Menu Screen -->
<div id="menu-screen">
<label for="class-selector" style="display: block; text-align: left; font-weight: 600; margin-bottom: 8px;">
🎯 Select Functional Group Class
</label>
<select id="class-selector" class="class-selector">
<option value="Alcohols">Alcohols</option>
<option value="Aldehydes">Aldehydes</option>
<option value="Ketones">Ketones</option>
<option value="Carboxylic Acids">Carboxylic Acids</option>
<option value="Amines">Amines</option>
<option value="Mixed">Mixed (All Classes)</option>
</select>
<button class="start-btn" onclick="startQuiz()">🚀 Start Quiz</button>
</div>
<!-- Quiz Screen -->
<div id="quiz-screen">
<div id="status-box"></div>
<div id="molecule-display">
<p id="loader">Loading chemistry library...</p>
<canvas id="molecule-canvas" width="280" height="260" style="display: none;"></canvas>
</div>
<p id="choices-label">📝 Select the correct IUPAC name:</p>
<div id="options-container"></div>
<div id="feedback"></div>
<div class="btn-container">
<button id="next-btn" class="btn-primary" style="display: none;" onclick="loadQuestion()">Next Question ➡️</button>
</div>
<div class="btn-container">
<button class="btn-secondary" onclick="backToMenu()">🏠 Menu</button>
<button class="btn-secondary" onclick="backToMenu()">🔄 Reset</button>
</div>
</div>
</div>
<script>

const dataset = [

{"class": "Aldehydes", "smiles": "CC(C)(C)CCC=O", "name": "4,4-Dimethylpentanal"},
// KETONES
{"class": "Ketones", "smiles": "CC(=O)C", "name": "Propan-2-one"},
{"class": "Ketones", "smiles": "CC(=O)CC", "name": "Butan-2-one"},

{"class": "Ketones", "smiles": "CCC(=O)CCC", "name": "Hexan-3-one"},
{"class": "Ketones", "smiles": "CCCC(=O)CC", "name": "Hexan-3-one"},
{"class": "Ketones", "smiles": "CCCC(=O)CCC", "name": "Heptan-4-one"},
{"class": "Ketones", "smiles": "CCCCC(=O)CCCC", "name": "Nonan-5-one"},
{"class": "Ketones", "smiles": "CC(=O)C(C)C", "name": "3-Methylbutan-2-one"},
{"class": "Ketones", "smiles": "CC(=O)C(C)CC", "name": "3-Methylpentan-2-one"},
{"class": "Ketones", "smiles": "CC(=O)CC(C)C", "name": "4-Methylpentan-2-one"},
{"class": "Ketones", "smiles": "CC(C)C(=O)C(C)C", "name": "2,4-Dimethylpentan-3-one"},
{"class": "Ketones", "smiles": "CCC(=O)C(C)C", "name": "2-Methylpentan-3-one"},
{"class": "Ketones", "smiles": "CCC(=O)C(C)CC", "name": "4-Methylhexan-3-one"},
{"class": "Ketones", "smiles": "CC(C)C(=O)CCC", "name": "2-Methylhexan-3-one"},
{"class": "Ketones", "smiles": "CC(C)(C)C(=O)C", "name": "3,3-Dimethylbutan-2-one"},

{"class": "Carboxylic Acids", "smiles": "CCCC(=O)O", "name": "Butanoic acid"},
{"class": "Carboxylic Acids", "smiles": "CCCCC(=O)O", "name": "Pentanoic acid"},

{"class": "Carboxylic Acids", "smiles": "CCCCCCCC(=O)O", "name": "Octanoic acid"},
{"class": "Carboxylic Acids", "smiles": "CC(C)C(=O)O", "name": "2-Methylpropanoic acid"},

{"class": "Carboxylic Acids", "smiles": "CCC(C)C(C)C(=O)O", "name": "2,3-Dimethylpentanoic acid"},
{"class": "Carboxylic Acids", "smiles": "CC(C)(C)CC(=O)O", "name": "3,3-Dimethylbutanoic acid"},
// AMINES
{"class": "Amines", "smiles": "CN", "name": "Methanamine"},
{"class": "Amines", "smiles": "CCN", "name": "Ethanamine"},
{"class": "Amines", "smiles": "CCCN", "name": "Propan-1-amine"},
{"class": "Amines", "smiles": "CCCCN", "name": "Butan-1-amine"},
{"class": "Amines", "smiles": "CCCCCN", "name": "Pentan-1-amine"},
{"class": "Amines", "smiles": "CCCCCCN", "name": "Hexan-1-amine"},
{"class": "Amines", "smiles": "CC(C)N", "name": "Propan-2-amine"},
{"class": "Amines", "smiles": "CCC(C)N", "name": "Butan-2-amine"},
{"class": "Amines", "smiles": "CCCC(C)N", "name": "Pentan-2-amine"},
{"class": "Amines", "smiles": "CC(C)(C)N", "name": "2-Methylpropan-2-amine"},
{"class": "Amines", "smiles": "CCCNCC", "name": "N-Ethylpropan-1-amine"},
{"class": "Amines", "smiles": "CCNC", "name": "N-Methylethanamine"},
{"class": "Amines", "smiles": "CCCN(C)C", "name": "N,N-Dimethylpropan-1-amine"},
{"class": "Amines", "smiles": "CNC(C)C", "name": "N-Methylpropan-2-amine"},
{"class": "Amines", "smiles": "CNCC(C)C", "name": "N,2-dimethylpropan-1-amine"},
{"class": "Amines", "smiles": "CCN(C)C", "name": "N,N-Dimethylethanamine"},
{"class": "Amines", "smiles": "CCN(CC)CC", "name": "N,N-Diethylethanamine"},
{"class": "Amines", "smiles": "CC(C)NC(C)C", "name": "diisopropylamine"},
{"class": "Amines", "smiles": "CN(C)CC(C)C", "name": "N,N,2-Trimethylpropan-1-amine"},
{"class": "Amines", "smiles": "CC(C)N(CC)CC", "name": "N,N-Diethylpropan-2-amine"},
];
const canvas = document.getElementById('molecule-canvas');
const loader = document.getElementById('loader');
const optionsContainer = document.getElementById('options-container');
const nextBtn = document.getElementById('next-btn');
const feedbackEl = document.getElementById('feedback');
const statusBox = document.getElementById('status-box');
let RDKitModule = null;
let questions = [];
let currentIdx = 0;
let score = 0;
let totalAnswered = 0;
let correctAnswer = "";
let answered = false;
// Initialize RDKit
window.initRDKitModule().then(function(RDKit) {
RDKitModule = RDKit;
loader.style.display = 'none';
canvas.style.display = 'block';
}).catch(() => {
loader.textContent = "Error: Could not load the chemistry drawing library.";
});
function startQuiz() {
const selectedClass = document.getElementById('class-selector').value;
if (selectedClass === "Mixed") {
questions = [...dataset];
} else {
questions = dataset.filter(item => item["class"] === selectedClass);
}
// Shuffle questions
questions.sort(() => Math.random() - 0.5);
currentIdx = 0;
score = 0;
totalAnswered = 0;
document.getElementById('menu-screen').style.display = 'none';
document.getElementById('quiz-screen').style.display = 'block';
loadQuestion();
}
function loadQuestion() {
if (!RDKitModule) {
setTimeout(loadQuestion, 500);
return;
}
answered = false;
nextBtn.style.display = 'none';
feedbackEl.textContent = '';
optionsContainer.innerHTML = '';
const currentQ = questions[currentIdx % questions.length];
// Update status
const percentage = totalAnswered > 0 ? (score / totalAnswered * 100).toFixed(1) : 0;
statusBox.innerHTML = `<strong>Question ${totalAnswered + 1}</strong> | Class: ${currentQ["class"]} | Score: ${score}/${totalAnswered} (${percentage}%)`;
// Draw molecule
try {
const mol = RDKitModule.get_mol(currentQ.smiles);
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
if (mol) {
mol.draw_to_canvas(canvas, -1, -1);
mol.delete();
}
} catch (e) {
console.error("Error drawing molecule:", e);
}
// Get options
const correctClass = currentQ["class"];
const candidates = dataset.filter(x => x["class"] === correctClass && x.name !== currentQ.name);
candidates.sort(() => Math.random() - 0.5);
const distractors = candidates.slice(0, 3);
const options = [currentQ.name, ...distractors.map(d => d.name)];
options.sort(() => Math.random() - 0.5);
correctAnswer = currentQ.name;
// Create option buttons
const labels = ['A', 'B', 'C', 'D'];
options.forEach((option, index) => {
const optionDiv = document.createElement('div');
optionDiv.className = 'option';
optionDiv.textContent = `${labels[index]}.   ${option}`;
optionDiv.addEventListener('click', () => submitAnswer(option));
optionsContainer.appendChild(optionDiv);
});
}
function submitAnswer(selectedName) {
if (answered) return;
answered = true;
totalAnswered++;
const isCorrect = selectedName === correctAnswer;
if (isCorrect) {
score++;
feedbackEl.textContent = "✅ Correct! Well done!";
feedbackEl.style.color = '#28a745';
} else {
feedbackEl.textContent = `❌ Incorrect — Correct answer: ${correctAnswer}`;
feedbackEl.style.color = '#dc3545';
}
// Mark options
const options = optionsContainer.querySelectorAll('.option');
options.forEach(opt => {
const optText = opt.textContent.split('   ')[1];
if (optText === correctAnswer) {
opt.classList.add('correct');
} else if (optText === selectedName && !isCorrect) {
opt.classList.add('incorrect');
}
opt.classList.add('disabled');
});
nextBtn.style.display = 'block';
currentIdx++;
}
function backToMenu() {
document.getElementById('menu-screen').style.display = 'block';
document.getElementById('quiz-screen').style.display = 'none';
// Reset
optionsContainer.innerHTML = '';
feedbackEl.textContent = '';
statusBox.innerHTML = '';
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
</body>
</html>
